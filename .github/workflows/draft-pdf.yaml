# Builds the JOSS paper preview PDF (paper/paper.md) with the Open Journals
# toolchain whenever the paper changes.
on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yaml
  workflow_dispatch:

name: JOSS draft PDF

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - uses: actions/checkout@v5
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
